name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          # bun lint / bun fmt / bun check are only in canary builds for now.
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun run --cwd apps/web cf-typegen
      - run: bun lint --max-warnings=0
      - run: bun fmt --check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
